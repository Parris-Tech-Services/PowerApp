name: PowerApp PR security and build

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/private-adult-intimacy-studio-20261106]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test behaviour, consent and encrypted vault
        run: npm test
      - name: Build production client
        run: npm run build
      - name: Check compiled content for accidentally embedded example secrets
        run: |
          if grep -R -q "not for server logs" dist/; then
            echo "Test private text leaked into compiled bundle"
            exit 1
          fi
          if grep -R -q "parris-network.js" dist/; then
            echo "Third party script still bundled"
            exit 1
          fi
