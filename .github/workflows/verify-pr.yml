name: PowerApp PR security and build

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/private-adult-intimacy-studio-20261106]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test behaviour, consent and encrypted vault
        run: npm test
      - name: Build production client
        run: npm run build
      - name: Install Chromium browser for synthetic UI test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Exercise mobile studio in a real browser
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/powerapp-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/PowerApp/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-studio.mjs
      - name: Check compiled content for accidentally embedded example secrets
        run: |
          if grep -R -q "not for server logs" dist/; then
            echo "Test private text leaked into compiled bundle"
            exit 1
          fi
          if grep -R -q "parris-network.js" dist/; then
            echo "Third party script still bundled"
            exit 1
          fi
